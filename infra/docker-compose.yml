services:
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    env_file:
      - ../.env.example
    volumes:
      - ../:/app
    command: python -m pytest -q

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chimera
      POSTGRES_USER: chimera
      POSTGRES_PASSWORD: chimera
    ports:
      - "5432:5432"
    volumes:
      - chimera_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  weaviate:
    image: semitechnologies/weaviate:1.25.5
    ports:
      - "8080:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      CLUSTER_HOSTNAME: "node-1"
    volumes:
      - chimera_weaviate:/var/lib/weaviate

volumes:
  chimera_pgdata:
  chimera_weaviate:
