services:
  orchestrator-api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      CHIMERA_CAMPAIGN_DB_BACKEND: postgres
      POSTGRES_URL: postgresql://chimera:chimera@postgres:5432/chimera
      REDIS_URL: redis://redis:6379/0
      WEAVIATE_URL: http://weaviate:8080
    volumes:
      - ../:/app
    command: uvicorn src.api.orchestrator_api:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      weaviate:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chimera
      POSTGRES_USER: chimera
      POSTGRES_PASSWORD: chimera
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - chimera_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chimera -d chimera"]
      interval: 5s
      timeout: 3s
      retries: 20

  weaviate:
    image: semitechnologies/weaviate:1.25.5
    ports:
      - "8080:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      CLUSTER_HOSTNAME: "node-1"
    volumes:
      - chimera_weaviate:/var/lib/weaviate

volumes:
  chimera_pgdata:
  chimera_weaviate:
