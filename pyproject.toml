[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "chimera-fde-trainee"
version = "0.1.0"
description = "Spec-driven architecture for autonomous AI influencers (FDE trainee)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ephrata Nebiyu" }]
dependencies = [
  "pydantic",
  "pytest",
  "redis",
  "weaviate-client",
  "requests",
  "coinbase-agentkit",
  "websockets",
  "fastapi",
  "uvicorn",
  "psycopg[binary]",
]

[project.optional-dependencies]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "websockets",
]

[project.scripts]
test = "pytest:main"

[tool.uv]
dev-dependencies = [
  "ruff",
  "mypy",
  "pytest",
  "websockets",
]
[tool.hatch.build.targets.wheel]
packages = ["src"]
